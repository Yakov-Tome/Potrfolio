<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="presentation">
  <!-- The figure is clipped to the circle inside the asset, so the avatar
       reads the same whether or not the CSS rounds it. The testimonial
       avatars carry no radius (the reference's are cut-out figures) and
       without this clip the shoulders spilled out of the circle there. -->
  <clipPath id="c">
    <circle cx="50" cy="50" r="50"/>
  </clipPath>
  <g clip-path="url(#c)">
    <circle cx="50" cy="50" r="50" fill="#DCDEFF"/>
    <circle cx="50" cy="40" r="16" fill="#1A1A1A"/>
    <path d="M18 100c0-19 14-30 32-30s32 11 32 30z" fill="#1A1A1A"/>
  </g>
</svg>
